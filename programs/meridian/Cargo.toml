[package]
name = "meridian"
version = "0.1.0"
description = "Binary stock outcome markets on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["metadata"] }
# pyth-solana-receiver-sdk is intentionally NOT a dep. Its current crate pulls
# a different Anchor version than this program. settle_market manually parses
# the posted PriceUpdateV2 account layout and verifies owner/feed/staleness/
# confidence instead. See docs/ARCHITECTURE.md.
