[package]
name = "meridian"
version = "0.1.0"
description = "Binary stock outcome markets on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["metadata"] }
# pyth-solana-receiver-sdk is intentionally NOT a dep. v1.2.0's PriceUpdateV2
# fails to compile under Anchor 1.0 (dual-borsh trait mismatch internal to
# Pyth's crate). settle_market is stubbed; admin_settle handles all settlement
# paths until a compatible Pyth SDK version ships. See docs/ARCHITECTURE.md.
