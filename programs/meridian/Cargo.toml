[package]
name = "meridian"
version = "0.1.0"
description = "Binary stock outcome markets on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# Pinned to 0.32.1 to match pyth-solana-receiver-sdk 1.2.0's internal anchor
# version. With anchor-lang 1.0.2 we hit a borsh 1.x vs 0.10.x trait mismatch
# on PriceUpdateV2. Anchor CLI stays at 1.0.2; only the crate version is pinned.
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["metadata"] }
pyth-solana-receiver-sdk = "1.2.0"
